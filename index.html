<body>

  <p>Odin Library</p>
  <div id="books"></div>
  <dialog id="book-dialog">
    <form>
      <label for="bTitle">Book title:</label><br>
      <input type="text" id="bTitle" name="bTitle" required><br>
  
      <label for="aname">Author name:</label><br>
      <input type="text" id="aname" name="aname" required><br>
  
      <label for="pages" name="pages">Number of Pages</label><br>
      <input type="number" id="pages" name="pages" min="1" required><br>
  
      <label for="read">Read?</label><br>
      <input type="checkbox" id="read" name="read" value="false"><br>
  
      <input type="submit" value="Add book">
      <button type="button" command="close" commandfor="book-dialog">Cancel</button>
    </form>
  </dialog>
  
  <button type="button" command="show-modal" commandfor="book-dialog">New book</button>
  <script src="js/scripts.js"></script>

</body>
